<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>PixelFrame</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
  #stage { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
  .slide {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: opacity 1.2s ease-in-out; overflow: hidden;
  }
  .slide.visible { opacity: 1; }
  .slide img, .slide video { max-width: 100%; max-height: 100%; object-fit: contain; }
  @keyframes kenburns {
    from { transform: scale(1); }
    to { transform: scale(1.08); }
  }
  .slide img.kenburns { animation-name: kenburns; animation-timing-function: linear; animation-fill-mode: forwards; }
  #empty {
    position: absolute; inset: 0;
    color: #666; font-family: system-ui, sans-serif; font-size: 1.1rem; text-align: center; padding: 0 20px;
  }
  /* Wichtig: display:flex nur wenn NICHT hidden, sonst überschreibt diese Regel
     das hidden-Attribut per CSS-Spezifität und der Hinweis liegt immer über
     dem Bild, selbst wenn die Diashow längst läuft. */
  #empty:not([hidden]) { display: flex; align-items: center; justify-content: center; }
  #fs-btn {
    position: absolute; right: 16px; bottom: 16px; z-index: 10;
    background: rgba(255,255,255,.12); color: #fff; border: 1px solid rgba(255,255,255,.3);
    border-radius: 8px; padding: 10px 16px; font-family: system-ui, sans-serif; font-size: 0.95rem;
    cursor: pointer; backdrop-filter: blur(4px);
  }
  #fs-btn[hidden] { display: none; }
</style>
</head>
<body>
  <div id="stage">
    <div class="slide" id="slide-a"></div>
    <div class="slide" id="slide-b"></div>
    <div id="empty" hidden>Noch keine Bilder. Bitte unter /upload hochladen.</div>
  </div>
  <button id="fs-btn">⤢ Vollbild</button>

<script>
(function () {
  var params = new URLSearchParams(location.search);
  var REFRESH_MS = 60000;   // Bilderliste & Einstellungen alle 60s neu laden
  var SCHEDULE_CHECK_MS = 30000; // Zeitplan unabhängig davon öfter neu prüfen
  var VIDEO_EXT = ['mp4', 'webm'];
  var KENBURNS_ORIGINS = ['center', 'top left', 'top right', 'bottom left', 'bottom right'];

  var slideA = document.getElementById('slide-a');
  var slideB = document.getElementById('slide-b');
  var emptyEl = document.getElementById('empty');
  var fsBtn = document.getElementById('fs-btn');
  var front = slideA, back = slideB;

  var images = [];
  var order = [];
  var pos = 0;
  var settings = {
    interval: 8, shuffle: false, kenburns: true,
    schedule_enabled: false, schedule_start: '22:00', schedule_end: '07:00'
  };
  var advanceTimer = null;
  var scheduledOff = false;

  function isVideo(name) {
    var ext = name.split('.').pop().toLowerCase();
    return VIDEO_EXT.indexOf(ext) !== -1;
  }

  function shuffleArray(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function buildOrder() {
    order = settings.shuffle ? shuffleArray(images) : images.slice();
    pos = 0;
  }

  function clearSlide(el) {
    // Falls dort ein Video lief: stoppen, sonst spielen mehrere im Hintergrund weiter.
    var video = el.querySelector('video');
    if (video) { video.pause(); video.removeAttribute('src'); video.load(); }
    el.innerHTML = '';
  }

  function swapIn() {
    front.classList.remove('visible');
    back.classList.add('visible');
    var t = front; front = back; back = t;
  }

  function scheduleAdvance(ms) {
    if (advanceTimer) clearTimeout(advanceTimer);
    advanceTimer = setTimeout(showNext, ms);
  }

  function showNext() {
    if (scheduledOff) return; // Nachtruhe: keine Wechsel, bis der Zeitplan wieder aktiv schaltet
    if (advanceTimer) { clearTimeout(advanceTimer); advanceTimer = null; }
    if (!order.length) {
      emptyEl.hidden = false;
      return;
    }
    emptyEl.hidden = true;
    var name = order[pos % order.length];
    pos++;
    if (pos >= order.length && settings.shuffle) buildOrder();

    clearSlide(back);
    var url = '/images/' + encodeURIComponent(name);

    if (isVideo(name)) {
      var video = document.createElement('video');
      video.muted = true;
      video.playsInline = true;
      video.autoplay = true;
      // Video spielt bis zum Ende, dann sofort weiter (nicht an feste Anzeigedauer gebunden).
      video.addEventListener('loadeddata', function () {
        swapIn();
        video.play().catch(function () {});
      });
      video.addEventListener('ended', function () { scheduleAdvance(0); });
      video.addEventListener('error', function () { scheduleAdvance(0); });
      video.src = url;
      back.appendChild(video);
    } else {
      var img = document.createElement('img');
      img.alt = '';
      img.onload = function () {
        swapIn();
        scheduleAdvance(Math.max(2, settings.interval || 8) * 1000);
      };
      img.onerror = function () { scheduleAdvance(0); };
      if (settings.kenburns) {
        var displaySec = Math.max(2, settings.interval || 8);
        img.className = 'kenburns';
        img.style.animationDuration = displaySec + 's';
        img.style.transformOrigin = KENBURNS_ORIGINS[Math.floor(Math.random() * KENBURNS_ORIGINS.length)];
      }
      img.src = url;
      back.appendChild(img);
    }
  }

  // ---------- Zeitplan (Nachtruhe) ----------
  function parseTimeToMinutes(hhmm) {
    var parts = (hhmm || '').split(':');
    var h = parseInt(parts[0], 10), m = parseInt(parts[1], 10);
    if (isNaN(h) || isNaN(m)) return null;
    return h * 60 + m;
  }

  function isWithinScheduleOff() {
    if (!settings.schedule_enabled) return false;
    var start = parseTimeToMinutes(settings.schedule_start);
    var end = parseTimeToMinutes(settings.schedule_end);
    if (start === null || end === null || start === end) return false;
    var now = new Date();
    var nowMin = now.getHours() * 60 + now.getMinutes();
    if (start < end) return nowMin >= start && nowMin < end;
    return nowMin >= start || nowMin < end; // Bereich über Mitternacht hinweg, z. B. 22:00–07:00
  }

  function applySchedule() {
    var shouldBeOff = isWithinScheduleOff();
    if (shouldBeOff === scheduledOff) return;
    scheduledOff = shouldBeOff;

    if (scheduledOff) {
      if (advanceTimer) { clearTimeout(advanceTimer); advanceTimer = null; }
      clearSlide(front);
      clearSlide(back);
      emptyEl.hidden = true;
      releaseWakeLock();
    } else {
      requestWakeLockIfSupported();
      if (order.length) showNext();
    }
  }

  function refreshAll() {
    var wasEmpty = !order.length;
    Promise.all([
      fetch('/api/images').then(function (r) { return r.json(); }),
      fetch('/api/settings').then(function (r) { return r.json(); })
    ]).then(function (results) {
      var nextImages = results[0].images || [];
      var nextSettings = results[1] || settings;

      var imagesChanged = nextImages.length !== images.length ||
        nextImages.some(function (n, i) { return n !== images[i]; });
      var shuffleChanged = nextSettings.shuffle !== settings.shuffle;

      images = nextImages;
      settings = nextSettings;

      if (imagesChanged || shuffleChanged || !order.length) buildOrder();

      applySchedule();

      // Erstes Bild/Video sofort zeigen statt auf einen Timer zu warten –
      // sonst bleibt der Bildschirm bei z. B. 100s Anzeigedauer lange schwarz.
      // Danach plant jede Anzeige selbst ihren nächsten Wechsel (Bild: nach
      // settings.interval; Video: sobald es zu Ende ist). Nicht während der
      // per Zeitplan konfigurierten Nachtruhe.
      if (wasEmpty && order.length && !scheduledOff) showNext();
    }).catch(function () { /* Netzwerkfehler ignorieren, alten Stand weiterverwenden */ });
  }

  // Manuelle Überschreibung per URL weiterhin möglich (z. B. ?interval=5),
  // sonst gelten die im Admin-Panel gespeicherten Einstellungen.
  if (params.has('interval')) settings.interval = parseFloat(params.get('interval')) || settings.interval;
  if (params.has('shuffle')) settings.shuffle = params.get('shuffle') === '1';

  // ---------- Vollbild ----------
  // Browser-Unterstützung ist auf Mobilgeräten sehr uneinheitlich (iOS Safari
  // z. B. teils gar nicht, teils nur mit Vendor-Präfix). Prinzip: Button nur
  // zeigen, wenn er wirklich etwas bewirken kann – sonst ausblenden, statt
  // einen kaputten Button stehen zu lassen.
  function fullscreenRequestFn() {
    var el = document.documentElement;
    return el.requestFullscreen || el.webkitRequestFullscreen || el.webkitRequestFullScreen ||
      el.mozRequestFullScreen || el.msRequestFullscreen || null;
  }

  function currentFullscreenElement() {
    return document.fullscreenElement || document.webkitFullscreenElement ||
      document.webkitCurrentFullScreenElement || document.mozFullScreenElement ||
      document.msFullscreenElement || null;
  }

  function requestFullscreen() {
    var fn = fullscreenRequestFn();
    if (!fn) return Promise.reject(new Error('Fullscreen API nicht unterstützt'));
    try {
      var result = fn.call(document.documentElement);
      return (result && typeof result.catch === 'function') ? result : Promise.resolve();
    } catch (e) {
      return Promise.reject(e);
    }
  }

  function updateFsButton() {
    fsBtn.hidden = !!currentFullscreenElement();
  }

  if (!fullscreenRequestFn()) {
    // Kein Support in irgendeiner Form (z. B. älteres iOS Safari) -> Button
    // erst gar nicht anzeigen, statt einen nutzlosen Button zu zeigen.
    fsBtn.hidden = true;
  } else {
    fsBtn.addEventListener('click', function () {
      requestFullscreen().catch(function () {
        // API vorhanden, Aufruf schlägt aber fehl (z. B. Browser-Policy) ->
        // Button dauerhaft ausblenden statt weiter einen kaputten Button zu zeigen.
        fsBtn.hidden = true;
      });
    });
    ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange']
      .forEach(function (evt) { document.addEventListener(evt, updateFsButton); });
    updateFsButton();

    // Best-effort wie bei YouTube: beim Drehen ins Querformat automatisch
    // versuchen, in den Vollbildmodus zu wechseln. Nicht in jedem Browser
    // garantiert (manche verlangen eine direkte Nutzer-Geste wie einen
    // Klick) – schlägt es fehl, bleibt der Button einfach als Fallback stehen.
    window.addEventListener('orientationchange', function () {
      setTimeout(function () {
        var isLandscape = window.innerWidth > window.innerHeight;
        if (isLandscape && !currentFullscreenElement()) {
          requestFullscreen().catch(function () {});
        }
      }, 300);
    });
  }

  // ---------- Bildschirm wach halten ----------
  var wakeLockSentinel = null;
  function requestWakeLockIfSupported() {
    if (!('wakeLock' in navigator)) return;
    navigator.wakeLock.request('screen').then(function (sentinel) {
      wakeLockSentinel = sentinel;
    }).catch(function () {});
  }
  function releaseWakeLock() {
    if (wakeLockSentinel) {
      wakeLockSentinel.release().catch(function () {});
      wakeLockSentinel = null;
    }
  }
  if ('wakeLock' in navigator) {
    requestWakeLockIfSupported();
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible' && !scheduledOff) requestWakeLockIfSupported();
    });
  }

  refreshAll();
  setInterval(refreshAll, REFRESH_MS);
  setInterval(applySchedule, SCHEDULE_CHECK_MS);
})();
</script>
</body>
</html>
